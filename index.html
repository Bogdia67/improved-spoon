    <!-- 1. Charge la bibliothèque officielle de Paddle (CORRIGÉ ICI) -->

</head>
<body>

    <!-- 2. Les deux boutons physiques sur la page -->
    <button onclick="lancerPaiement('pri_01kyfk028z53s3efe371fz4n0m')">
      S'abonner au mois
    </button>

    <button onclick="lancerPaiement('pri_01kyfkvjwy75px1373btjctepv')">
      S'abonner à l'année
    </button>

    <!-- 3. Le script de configuration de Paddle -->
    <script type="text/javascript">
      Paddle.Environment.set("sandbox");

      Paddle.Initialize({ 
        token: "test_40338cad6ee5e3a1dac969ee766" 
      });

      function lancerPaiement(idDuPrix) {
        Paddle.Checkout.open({
          items: [

              quantity: 1
            }
          ]
        });
      }
    </script>
